<!DOCTYPE html>
<html>
<head>
    <title>Login - MedOriva AI</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f0f4f8; }
        .login-container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 380px; }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { color: #0F6E56; font-size: 28px; }
        .logo p { color: #666; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: bold; color: #333; font-size: 14px; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; }
        .form-group input:focus { border-color: #0F6E56; outline: none; }
        .btn { width: 100%; padding: 12px; background: #0F6E56; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
        .btn:hover { background: #0a5a45; }
        .error { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 6px; margin-bottom: 20px; text-align: center; }
        .demo-note { margin-top: 20px; text-align: center; font-size: 13px; color: #999; background: #f8f9fa; padding: 10px; border-radius: 6px; }
        .demo-note strong { color: #0F6E56; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>MedOriva AI</h1>
            <p>Multilingual Healthcare Communication</p>
        </div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="error">{{ messages[0] }}</div>
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn">Login</button>
        </form>

        <div class="demo-note">
            <strong>Demo Access</strong><br>
            Email: <strong>demo@medoriva.com</strong><br>
            Password: <strong>medoriva2026</strong>
        </div>
    </div>
</body>
</html>
